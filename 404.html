<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<link rel="stylesheet" href="style.css">

<style>
.error-page{
  min-height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:60px 20px;
  text-align:center;
}

.error-box{
  max-width:760px;
  background:#f5f5f5;
  border-radius:25px;
  padding:70px 40px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.error-code{
  font-size:120px;
  font-weight:900;
  line-height:1;
  color:#111;
  margin-bottom:20px;
}

.error-box h1{
  font-size:42px;
  margin-bottom:18px;
}

.error-box p{
  font-size:19px;
  color:#555;
  margin-bottom:32px;
}

.error-actions{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.secondary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:white;
  color:#111;
  text-decoration:none;
  border:2px solid #111;
  padding:14px 28px;
  border-radius:12px;
  font-weight:700;
  transition:.25s;
}

.secondary-btn:hover{
  background:#111;
  color:white;
  transform:translateY(-2px);
}

@media(max-width:768px){
  .error-code{
    font-size:86px;
  }

  .error-box{
    padding:50px 24px;
  }

  .error-box h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SNEAKER SHOP</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="favorites.html">❤️ Favorites (<span id="fav-count">0</span>)</a>
    <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<main class="error-page">

  <section class="error-box">
    <div class="error-code">404</div>

    <h1>Page Not Found</h1>

    <p>
      The page you are looking for does not exist or has been moved.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn">Back Home</a>
      <a href="shop.html" class="secondary-btn">Go to Shop</a>
    </div>
  </section>

</main>

<footer>
  © 2026 Sneaker Shop — All Rights Reserved
</footer>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

document.getElementById("cart-count").innerText =
  cart.reduce((total,item) => total + item.quantity, 0);

document.getElementById("fav-count").innerText =
  favorites.length;
</script>

</body>
</html>
