```html
<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>

.cart-container{
max-width:1200px;
margin:60px auto;
padding:20px;
}

.cart-title{
font-size:55px;
margin-bottom:40px;
text-align:center;
}

.cart-item{
display:flex;
align-items:center;
gap:30px;
background:white;
border-radius:20px;
padding:25px;
margin-bottom:25px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.cart-item img{
width:180px;
height:180px;
object-fit:contain;
background:#f5f5f5;
border-radius:15px;
padding:15px;
}

.cart-info{
flex:1;
}

.cart-info h2{
font-size:32px;
margin-bottom:10px;
color:#111;
}

.cart-price{
font-size:26px;
font-weight:bold;
margin-bottom:20px;
color:#111;
}

.quantity{
display:flex;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.quantity button{
width:40px;
height:40px;
border:none;
border-radius:8px;
background:#111;
color:white;
font-size:20px;
cursor:pointer;
}

.remove-btn{
padding:12px 22px;
border:none;
border-radius:10px;
background:#d62828;
color:white;
cursor:pointer;
font-weight:bold;
}

.summary{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-top:40px;
}

.summary h2{
margin-bottom:30px;
color:#111;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:22px;
color:#111;
}

.checkout-btn{
width:100%;
margin-top:30px;
padding:18px;
background:#111;
color:white;
border:none;
border-radius:12px;
font-size:20px;
cursor:pointer;
font-weight:bold;
}

.empty-cart{
text-align:center;
font-size:26px;
padding:80px;
background:white;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
color:#111;
}

@media(max-width:900px){

.cart-item{
flex-direction:column;
text-align:center;
}

.cart-item img{
width:220px;
height:220px;
}

.summary-row{
font-size:18px;
}

}

</style>

</head>

<body>

</div>

<div class="summary-row">

<span>Subtotal</span>

<span id="subtotal">€0</span>

</div>

<span>Shipping</span>

<span>FREE</span>

</div>

<hr style="margin:25px 0;">

<div class="summary-row">

<strong>Total</strong>

<strong id="total">€0</strong>

</div>

<button

</div>

let subtotal = 0;

`

</div>
`;

}
else{

subtotal +=
item.price * item.quantity;

cartBox.innerHTML +=

`
<div class="cart-item">

```html
<div class="cart-info">

<h2>${item.name}</h2>

<div class="cart-price">
€${item.price}
</div>

<div class="quantity">

<button onclick="changeQuantity(${index},-1)">
-
</button>

<span>${item.quantity}</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

</div>

<button
class="remove-btn"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});

}

document.getElementById("subtotal").innerText =
"€" + subtotal;

document.getElementById("total").innerText =
"€" + subtotal;

document.getElementById("cart-count").innerText =
cart.reduce((total,item)=>total+item.quantity,0);

function changeQuantity(index,value){

cart[index].quantity += value;

if(cart[index].quantity <= 0){

cart.splice(index,1);

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

location.reload();

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

location.reload();

}

let favorites =
JSON.parse(localStorage.getItem("favorites"))
|| [];

document.getElementById("fav-count").innerText =
favorites.length;

</script>
