<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shop - Sneaker Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
SNEAKER SHOP
</div>

<nav>

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="favorites.html">
❤️ Favorites
(<span id="fav-count">0</span>)
</a>

<a href="cart.html">
🛒 Cart
(<span id="cart-count">0</span>)
</a>

</nav>

</header>

<section class="hero">

<h1>SHOP</h1>

</section>

<div class="container">

<section class="filter-box">

<h2>
Find Your Perfect Sneaker
</h2>

<select id="brand">

<option value="all">
All Brands
</option>

<option value="nike">
Nike
</option>

<option value="adidas">
Adidas
</option>

<option value="puma">
Puma
</option>

<option value="newbalance">
New Balance
</option>

</select>

<select id="price">

<option value="all">
Any Price
</option>

<option value="100">
Under €100
</option>

<option value="150">
Under €150
</option>

<option value="200">
Under €200
</option>

<option value="250">
Under €250
</option>

<option value="300">
Under €300
</option>

</select>

<select id="size">

<option value="">
Choose Size
</option>

<option>38</option>
<option>39</option>
<option>40</option>
<option>41</option>
<option>42</option>
<option>43</option>
<option>44</option>
<option>45</option>

</select>

<button onclick="filterSneakers()">
Show Sneakers
</button>

</section>

<div
class="grid"
id="products-grid">

</div>

</div>

<footer>

© 2026 Sneaker Shop —
All Rights Reserved

</footer>

<script src="script.js"></script>

<script>
fetch("sneakers.json")
  .then(response => response.json())
  .then(sneakers => {
    const grid = document.getElementById("products-grid");
    grid.innerHTML = "";

    sneakers.forEach(shoe => {
      grid.innerHTML += `
        <div class="card ${shoe.brand}" data-price="${shoe.price}">
          <img src="${shoe.image}" alt="${shoe.name}">

          <div class="card-content">
            <h3>${shoe.name}</h3>
            <p class="price">€${shoe.price}</p>

            <button class="fav-btn" onclick="addToFavorites(${shoe.id}, '${shoe.name}', ${shoe.price}, '${shoe.image}')">
              Favorite
            </button>

            <a href="product.html?id=${shoe.id}" class="buy-btn">More</a>

            <button class="buy-btn" onclick="addToCart(${shoe.id}, '${shoe.name}', ${shoe.price}, '${shoe.image}')">
              Add to Cart
            </button>
          </div>
        </div>
      `;
    });

    updateCartCount();
    updateFavoriteCount();
  });
  })
  .catch(error => {
    console.error(error);
    document.getElementById("products-grid").innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px;">
        <h2>Unable to load sneakers.</h2>
        <p>Please try again later.</p>
      </div>
    `;
  });
</script>

</body>

</html>
