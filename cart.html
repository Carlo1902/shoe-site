<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="style.css">

<style>
.cart-container{
  max-width:1200px;
  margin:60px auto;
  padding:20px;
}

.cart-title{
  font-size:55px;
  margin-bottom:40px;
  text-align:center;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:30px;
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.cart-item img{
  width:220px;
  height:220px;
  object-fit:contain;
  background:#f7f7f7;
  border-radius:20px;
  padding:20px;
}

.cart-info{
  flex:1;
}

.cart-info h2{
  font-size:32px;
  margin-bottom:10px;
  color:#111;
}

.cart-price{
  font-size:26px;
  font-weight:bold;
  margin-bottom:20px;
  color:#111;
}

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.quantity button{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#f3f3f3;
  color:black;
  font-size:22px;
  font-weight:bold;
  border:1px solid #ddd;
  transition:.2s;
}

.quantity button:hover{
  background:#111;
  color:white;
}

.remove-btn{
  padding:12px 22px;
  border:2px solid #111;
  border-radius:10px;
  background:white;
  color:#111;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.remove-btn:hover{
  background:#111;
  color:white;
}

.summary{
  background:white;
  padding:35px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-top:40px;
}

.summary h2{
  margin-bottom:30px;
  color:#111;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  font-size:22px;
  color:#111;
}

.checkout-btn{
  width:100%;
  margin-top:30px;
  padding:18px;
  background:black;
  color:white;
  border:none;
  border-radius:50px;
  font-size:20px;
  cursor:pointer;
  font-weight:bold;
  transition:.25s;
}

.checkout-btn:hover{
  transform:scale(1.03);
  background:#333;
}

.empty-cart{
  text-align:center;
  font-size:26px;
  padding:80px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  color:#111;
}

@media(max-width:900px){
  .cart-item{
    flex-direction:column;
    text-align:center;
  }

  .cart-item img{
    width:220px;
    height:220px;
  }

  .summary-row{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SNEAKER SHOP</div>

  <button class="menu-toggle" onclick="toggleMenu()">
    ☰
  </button>

  <nav id="nav-menu">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="favorites.html">❤️ Favorites (<span id="fav-count">0</span>)</a>
    <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>
<div class="cart-container">

  <h1 class="cart-title">Shopping Cart</h1>

  <div id="cart-items"></div>

  <div class="summary">
    <h2>Order Summary</h2>

    <div class="summary-row">
      <span>Subtotal</span>
      <span id="subtotal">€0</span>
    </div>

    <div class="summary-row">
      <span>Shipping</span>
      <span>FREE</span>
    </div>

    <hr style="margin:25px 0;">

    <div class="summary-row">
      <strong>Total</strong>
      <strong id="total">€0</strong>
    </div>

    <button class="checkout-btn" onclick="location.href='checkout.html'">
      Proceed to Checkout
    </button>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

let cartBox = document.getElementById("cart-items");
let subtotal = 0;

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function updateCounts(){
  document.getElementById("cart-count").innerText =
    cart.reduce((total,item) => total + item.quantity, 0);

  document.getElementById("fav-count").innerText =
    favorites.length;
}

function renderCart(){
  cartBox.innerHTML = "";
  subtotal = 0;

  if(cart.length === 0){
    cartBox.innerHTML = `
      <div class="empty-cart">
        Your shopping cart is empty.
      </div>
    `;

    document.getElementById("subtotal").innerText = "€0";
    document.getElementById("total").innerText = "€0";
    updateCounts();
    return;
  }

  cart.forEach((item,index) => {
    subtotal += item.price * item.quantity;

    cartBox.innerHTML += `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">

        <div class="cart-info">
          <h2>${item.name}</h2>

          <div class="cart-price">
            €${item.price}
          </div>

          <div class="quantity">
            <button onclick="changeQuantity(${index}, -1)">-</button>
            <span>${item.quantity}</span>
            <button onclick="changeQuantity(${index}, 1)">+</button>
          </div>

          <button class="remove-btn" onclick="removeItem(${index})">
            Remove
          </button>
        </div>
      </div>
    `;
  });

  document.getElementById("subtotal").innerText = "€" + subtotal;
  document.getElementById("total").innerText = "€" + subtotal;

  updateCounts();
}

function changeQuantity(index,value){
  cart[index].quantity += value;

  if(cart[index].quantity <= 0){
    cart.splice(index,1);
  }

  saveCart();
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  saveCart();
  renderCart();
}

renderCart();
</script>

<footer>
  © 2026 Sneaker Shop — All Rights Reserved
</footer>

</body>
</html>
