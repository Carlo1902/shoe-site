<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Sneaker Vault</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial, sans-serif;
}

header{
  background:black;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#f5c542;
  font-size:32px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:25px;
  transition:0.3s;
}

nav a:hover{
  color:#f5c542;
}

.hero{
  height:50vh;
  background:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1800')
  center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
}

.hero h1{
  font-size:80px;
  background:rgba(0,0,0,0.6);
  padding:20px 40px;
  border-radius:15px;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:70px 30px;
}

.filters{
  text-align:center;
  margin-bottom:50px;
}

.filters button{
  background:#1f1f1f;
  color:white;
  border:none;
  padding:15px 30px;
  margin:10px;
  border-radius:6px;
  cursor:pointer;
  font-size:18px;
  font-weight:bold;
  transition:0.3s;
}

.filters button:hover{
  background:#f5c542;
  color:black;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.card{
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
  display:none;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card h3{
  margin-bottom:15px;
}

.price{
  color:#f5c542;
  font-size:22px;
  margin-bottom:15px;
}

.buy-btn{
  display:inline-block;
  background:#f5c542;
  color:black;
  padding:12px 25px;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

footer{
  background:black;
  text-align:center;
  padding:30px;
  margin-top:70px;
}

</style>
</head>

<body>

<header>

<div class="logo">SNEAKER VAULT</div>

<button onclick="filterSelection('newbalance')">New Balance</button>

</div>

<div class="grid">

<div class="card nike">
<img src="https://images.unsplash.com/photo-1711491559395-c82f70a68bfb?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">

<script>

function filterSelection(category){

let cards = document.querySelectorAll('.card');

cards.forEach(card => {

card.style.display = 'none';

if(card.classList.contains(category)){
  card.style.display = 'block';
}

});

}

</script>

</body>
</html>
